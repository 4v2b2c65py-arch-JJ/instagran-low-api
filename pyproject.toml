[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagran-low-api"
version = "1.0.0"
description = "Complete solution for device OS reaction data gathering and cross-service callbacks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "4v2b2c65py-arch-JJ", email = "dev@instagran-low-api.com"}
]
keywords = ["os-reaction", "pinecone", "device-monitoring", "cross-service", "callbacks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "pytz>=2023.3",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
pinecone = [
    "pinecone-client>=3.0.0",
]

[project.scripts]
instagran-api = "neural_orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/4v2b2c65py-arch-JJ/instagran-low-api"
Documentation = "https://github.com/4v2b2c65py-arch-JJ/instagran-low-api#readme"
Repository = "https://github.com/4v2b2c65py-arch-JJ/instagran-low-api.git"
Issues = "https://github.com/4v2b2c65py-arch-JJ/instagran-low-api/issues"

[tool.setuptools]
packages = ["neural_orchestrator"]

[tool.setuptools.package-data]
neural_orchestrator = ["*.json", "*.yaml", "*.yml"]
